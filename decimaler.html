<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decimalutmaningen</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen text-slate-800 flex flex-col justify-between p-4">
    <div class="max-w-md w-full mx-auto my-auto bg-white rounded-3xl shadow-xl p-6 sm:p-8 border border-indigo-50 text-center space-y-6">
        <div class="flex justify-between items-center text-xs font-semibold">
            <span class="bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full">Decimaler</span>
            <span id="progress-text" class="text-slate-500">Fråga 1 av 100</span>
        </div>
        <div class="bg-emerald-50/70 text-emerald-900 p-3 rounded-xl text-xs font-semibold">
            Räkna ut talet, eller skriv det balanserade talet (t.ex. 3,00) med rätt nollor!
        </div>

        <div id="question-text" class="text-3xl font-extrabold text-slate-800 py-2"></div>

        <input type="text" id="answer-input" autocomplete="off" autofocus placeholder="Svar..."
            class="w-full py-4 px-4 text-center border-2 border-slate-200 rounded-2xl focus:border-emerald-600 focus:ring-4 focus:ring-emerald-100 focus:outline-none font-extrabold text-2xl text-emerald-700 bg-slate-50">

        <a href="index.html" class="block w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs transition-all">
            ← Tillbaka till menyn
        </a>
    </div>

    <div id="result-container" class="hidden max-w-md w-full mx-auto my-auto bg-white rounded-3xl shadow-xl p-8 border border-emerald-50 text-center space-y-6">
        <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl shadow-inner">🏆</div>
        <h2 class="text-2xl font-extrabold text-slate-900">Bra jobbat! 🎉</h2>
        <p id="score-text" class="text-slate-600 text-base"></p>
        <div class="space-y-3">
            <button onclick="location.reload()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition-all">Kör igen 🔄</button>
            <a href="index.html" class="block w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition-all">Tillbaka till menyn</a>
        </div>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let score = 0;
        const operations = ['+', '-', '*'];

        for (let i = 0; i < 100; i++) {
            const op = operations[Math.floor(Math.random() * operations.length)];
            let d1 = Math.floor(Math.random() * 3);
            let d2 = Math.floor(Math.random() * 3);
            if (d1 === d2) d2 = (d1 + 1) % 3;

            let base1 = Math.floor(Math.random() * 89) + 10; 
            let base2 = Math.floor(Math.random() * 89) + 10;
            let n1 = base1 / Math.pow(10, d1);
            let n2 = base2 / Math.pow(10, d2);

            if (op === '-' && n1 < n2) { [n1, n2] = [n2, n1]; [d1, d2] = [d2, d1]; }

            let exactAns = op === '+' ? n1 + n2 : (op === '-' ? n1 - n2 : n1 * n2);
            exactAns = Math.round(exactAns * 1000) / 1000;
            let targetDec = Math.max(d1, d2);

            let acceptList = [
                exactAns.toString().replace('.', ','),
                exactAns.toString(),
                exactAns.toFixed(1).replace('.', ','),
                exactAns.toFixed(2).replace('.', ','),
                exactAns.toFixed(3).replace('.', ',')
            ];
            acceptList.push(n1.toFixed(targetDec).replace('.', ','), n2.toFixed(targetDec).replace('.', ','));
            acceptList = [...new Set(acceptList)];

            let opSymbol = op === '*' ? '×' : op;
            questions.push({ text: `${n1.toFixed(d1).replace('.', ',')} ${opSymbol} ${n2.toFixed(d2).replace('.', ',')} = ?`, accept: acceptList });
        }

        const inputField = document.getElementById('answer-input');
        const questionText = document.getElementById('question-text');
        const progressText = document.getElementById('progress-text');

        function showQuestion() {
            if (currentIndex >= 100) {
                inputField.parentElement.classList.add('hidden');
                document.getElementById('result-container').classList.remove('hidden');
                document.getElementById('score-text').innerHTML = `Du fick <strong>${score}</strong> av 100 rätt!`;
                return;
            }
            questionText.textContent = questions[currentIndex].text;
            progressText.textContent = `Fråga ${currentIndex + 1} av 100`;
            inputField.value = '';
            inputField.focus();
        }

        function checkAnswer() {
            const userVal = inputField.value.trim().replace('.', ',');
            if (userVal === '') return;
            if (questions[currentIndex].accept.includes(userVal)) {
                score++;
                currentIndex++;
                showQuestion();
            }
        }

        inputField.addEventListener('input', checkAnswer);
        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                const userVal = inputField.value.trim().replace('.', ',');
                if (questions[currentIndex].accept.includes(userVal)) score++;
                currentIndex++;
                showQuestion();
            }
        });

        showQuestion();
    </script>
</body>
</html>
