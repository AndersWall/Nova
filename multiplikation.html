<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplikationsutmaningen</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen text-slate-800 flex flex-col justify-between p-4">
    <div class="max-w-md w-full mx-auto my-auto bg-white rounded-3xl shadow-xl p-6 sm:p-8 border border-indigo-50 text-center space-y-6">
        <div class="flex justify-between items-center text-xs font-semibold">
            <span class="bg-indigo-50 text-indigo-700 px-3 py-1 rounded-full">Multiplikation</span>
            <span id="progress-text" class="text-slate-500">Fråga 1 av 100</span>
        </div>

        <div id="question-text" class="text-4xl font-extrabold text-slate-800 py-4">3 × 4 = ?</div>

        <input type="number" id="answer-input" autocomplete="off" autofocus placeholder="Svar..."
            class="w-full py-4 px-4 text-center border-2 border-slate-200 rounded-2xl focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 focus:outline-none font-extrabold text-2xl text-indigo-700 bg-slate-50">

        <a href="index.html" class="block w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs transition-all">
            ← Tillbaka till menyn
        </a>
    </div>

    <div id="result-container" class="hidden max-w-md w-full mx-auto my-auto bg-white rounded-3xl shadow-xl p-8 border border-indigo-50 text-center space-y-6">
        <div class="w-16 h-16 bg-emerald-50 text-emerald-600 rounded-full flex items-center justify-center mx-auto text-3xl shadow-inner">🏆</div>
        <h2 class="text-2xl font-extrabold text-slate-900">Bra jobbat! 🎉</h2>
        <p id="score-text" class="text-slate-600 text-base"></p>
        <div class="space-y-3">
            <button onclick="location.reload()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl transition-all">Kör igen 🔄</button>
            <a href="index.html" class="block w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition-all">Tillbaka till menyn</a>
        </div>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let score = 0;

        for (let i = 0; i < 100; i++) {
            const a = Math.floor(Math.random() * 9) + 1;
            const b = Math.floor(Math.random() * 9) + 1;
            questions.push({ text: `${a} × ${b} = ?`, ans: (a * b).toString() });
        }

        const inputField = document.getElementById('answer-input');
        const questionText = document.getElementById('question-text');
        const progressText = document.getElementById('progress-text');

        function showQuestion() {
            if (currentIndex >= 100) {
                document.getElementById('answer-input').parentElement.classList.add('hidden');
                document.getElementById('result-container').classList.remove('hidden');
                document.getElementById('score-text').innerHTML = `Du fick <strong>${score}</strong> av 100 rätt!`;
                return;
            }
            questionText.textContent = questions[currentIndex].text;
            progressText.textContent = `Fråga ${currentIndex + 1} av 100`;
            inputField.value = '';
            inputField.focus();
        }

        inputField.addEventListener('input', () => {
            if (inputField.value.trim() === questions[currentIndex].ans) {
                score++;
                currentIndex++;
                showQuestion();
            }
        });
        inputField.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (inputField.value.trim() === questions[currentIndex].ans) score++;
                currentIndex++;
                showQuestion();
            }
        });

        showQuestion();
    </script>
</body>
</html>
