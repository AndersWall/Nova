<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decimalbalansen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        /* Svagt grå (Slate-300) för kommatecken och inledande nolla i steg 2 */
        .dimmed {
            color: #cbd5e1 !important; 
        }

        /* Skakanimation vid fel svar */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .shake {
            animation: shake 0.4s ease-in-out;
        }

        /* Sprite-fönster: 100px bredd & 189px höjd med dynamisk positionering */
        .warrior-avatar {
            width: 100px;             
            height: 189px;            
            flex-shrink: 0;           
            background-image: url('watermarked_img_11824166666452409595.jpg');
            background-size: 1000% 100%;
            background-position: 0% 50%;
            background-repeat: no-repeat;
            image-rendering: pixelated;
            transition: background-position 0.3s ease, transform 0.3s ease;
        }

        /* Studs-animation vid nivå-upp */
        .level-up-anim {
            transform: scale(1.15);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-purple-50 to-pink-50 min-h-screen text-slate-900 flex flex-col justify-between p-4">
    
    <!-- Spelcontainer -->
    <div id="game-container" class="max-w-xl w-full mx-auto my-auto bg-white rounded-3xl shadow-xl p-6 sm:p-8 border border-indigo-50 text-center space-y-5">
        
        <!-- Översta statusraden -->
        <div class="flex justify-between items-center w-full text-xs font-semibold px-1">
            <span id="step-badge" class="bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full">Steg 1: Balansera</span>
            <span id="level-badge" class="bg-amber-100 text-amber-800 px-3 py-1 rounded-full">Nivå 1 / 10</span>
            <span id="progress-text" class="text-slate-500">Fråga 1 av 50</span>
        </div>
        
        <!-- Sektion med karaktären till vänster och instruktionsrutan till höger -->
        <div class="flex items-center gap-4 text-left bg-slate-50 p-4 rounded-2xl border border-slate-100 shadow-inner">
            <!-- Karaktären till vänster (uppgraderas dynamiskt) -->
            <div id="warrior-img" class="warrior-avatar rounded-2xl border-2 border-indigo-100 bg-white shadow-sm" title="Din krigarkompis"></div>
            
            <!-- Instruktionsrutan till höger -->
            <div id="instruction-box" class="bg-indigo-50/80 text-indigo-950 p-4 rounded-xl text-xs sm:text-sm font-semibold border border-indigo-100 shadow-sm leading-relaxed flex-1">
                Vilket av talen behöver fyllas ut med nollor för att få lika många decimaler? Skriv det talet:
            </div>
        </div>

        <!-- Frågeområde -->
        <div id="question-text" class="text-3xl font-black text-slate-900 py-2 tracking-wide">Laddar...</div>

        <form id="answer-form" onsubmit="submitAnswer(event)" class="space-y-4">
            <input type="text" id="answer-input" autocomplete="off" autofocus placeholder="Svar..."
                class="w-full py-4 px-4 text-center border-2 border-slate-200 rounded-2xl focus:border-indigo-600 focus:ring-4 focus:ring-indigo-100 focus:outline-none font-extrabold text-2xl text-indigo-700 bg-slate-50 transition-all">
            
            <button type="submit" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all shadow-md">
                Svara (Enter)
            </button>
        </form>

        <a href="index.html" class="block w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl text-xs transition-all">
            ← Tillbaka till menyn
        </a>
    </div>

    <!-- Resultatcontainer -->
    <div id="result-container" class="hidden max-w-md w-full mx-auto my-auto bg-white rounded-3xl shadow-xl p-8 border border-emerald-50 text-center space-y-6">
        <div class="w-16 h-16 bg-indigo-50 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-3xl shadow-inner">🏆</div>
        <h2 class="text-2xl font-extrabold text-slate-900">Bra jobbat! 🎉</h2>
        <p id="score-text" class="text-slate-600 text-base"></p>
        <div class="space-y-3">
            <button onclick="location.reload()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-xl transition-all">Kör igen 🔄</button>
            <a href="index.html" class="block w-full py-3 bg-slate-100 hover:bg-slate-200 text-slate-600 font-bold rounded-xl transition-all">Tillbaka till menyn</a>
        </div>
    </div>

    <script>
        const TOTAL_QUESTIONS = 50;
        let questions = [];
        let currentIndex = 0;
        let currentSubStep = 1; // 1 = Balansera, 2 = Räkna ut
        let score = 0;
        const operations = ['+', '-', '*'];

        // Positioner för de 10 karaktärerna i sprite-arket (0% till 100%)
        const spritePositions = [
            "0%", "11.1%", "22.2%", "33.3%", "44.4%", 
            "55.5%", "66.6%", "77.7%", "88.8%", "100%"
        ];

        for (let i = 0; i < TOTAL_QUESTIONS; i++) {
            const op = operations[Math.floor(Math.random() * operations.length)];
            
            let d1 = Math.floor(Math.random() * 3); 
            let d2 = Math.floor(Math.random() * 3);
            if (d1 === d2) d2 = (d1 + 1) % 3;

            let base1 = Math.floor(Math.random() * 89) + 10; 
            let base2 = Math.floor(Math.random() * 89) + 10;
            
            let n1 = base1 / Math.pow(10, d1);
            let n2 = base2 / Math.pow(10, d2);

            if (op === '-' && n1 < n2) { 
                [n1, n2] = [n2, n1]; 
                [d1, d2] = [d2, d1]; 
            }

            const targetDec = Math.max(d1, d2);
            
            let balanced1 = n1.toFixed(targetDec).replace('.', ',');
            let balanced2 = n2.toFixed(targetDec).replace('.', ',');

            let needsBalancing = d1 < targetDec ? 1 : 2;
            let targetBalancedVal = needsBalancing === 1 ? balanced1 : balanced2;

            let rawResult;
            if (op === '+') rawResult = n1 + n2;
            else if (op === '-') rawResult = n1 - n2;
            else rawResult = n1 * n2;

            let exactAns = Number(rawResult.toFixed(4));
            let finalAccept = [
                exactAns.toString(),
                exactAns.toString().replace('.', ','),
                exactAns.toFixed(targetDec),
                exactAns.toFixed(targetDec).replace('.', ',')
            ];

            let opSymbol = op === '*' ? '×' : op;
            
            questions.push({
                n1Str: n1.toFixed(d1).replace('.', ','),
                n2Str: n2.toFixed(d2).replace('.', ','),
                balanced1: balanced1,
                balanced2: balanced2,
                needsBalancing: needsBalancing,
                targetBalancedVal: targetBalancedVal,
                opSymbol: opSymbol,
                acceptFinal: Array.from(new Set(finalAccept)),
                isHard: op === '*' || targetDec === 2
            });
        }

        const inputField = document.getElementById('answer-input');
        const questionText = document.getElementById('question-text');
        const progressText = document.getElementById('progress-text');
        const stepBadge = document.getElementById('step-badge');
        const levelBadge = document.getElementById('level-badge');
        const instructionBox = document.getElementById('instruction-box');
        const warriorImg = document.getElementById('warrior-img');
        const gameContainer = document.getElementById('game-container');
        const resultContainer = document.getElementById('result-container');

        // Formaterar talet för steg 2: Inledande nolla och kommatecken är ljusgrå
        function buildDimmedHTML(numStr) {
            let parts = numStr.split(',');
            let intPart = parts[0];
            let decPart = parts[1];

            let formattedInt = intPart.startsWith('0') 
                ? `<span class="dimmed">0</span>` + intPart.substring(1)
                : intPart;

            if (!decPart) return formattedInt;

            return `${formattedInt}<span class="dimmed">,</span>${decPart}`;
        }

        function triggerErrorEffect() {
            inputField.classList.add('border-red-500', 'shake');
            setTimeout(() => {
                inputField.classList.remove('border-red-500', 'shake');
            }, 400);
            inputField.select();
        }

        function updateWarriorLevel() {
            let levelIndex = Math.min(Math.floor(currentIndex / 5), 9);
            warriorImg.style.backgroundPosition = `${spritePositions[levelIndex]} 50%`;
            levelBadge.textContent = `Nivå ${levelIndex + 1} / 10`;

            warriorImg.classList.add('level-up-anim');
            setTimeout(() => warriorImg.classList.remove('level-up-anim'), 300);
        }

        function showQuestion() {
            if (currentIndex >= TOTAL_QUESTIONS) {
                gameContainer.classList.add('hidden');
                resultContainer.classList.remove('hidden');
                document.getElementById('score-text').innerHTML = `Du klarade alla <strong>${TOTAL_QUESTIONS}</strong> frågor! 🎉`;
                return;
            }

            updateWarriorLevel();

            progressText.textContent = `Fråga ${currentIndex + 1} av ${TOTAL_QUESTIONS}`;
            inputField.value = '';
            inputField.focus();

            const q = questions[currentIndex];

            if (currentSubStep === 1) {
                stepBadge.textContent = "Steg 1: Balansera";
                stepBadge.className = "bg-indigo-100 text-indigo-800 px-3 py-1 rounded-full font-semibold";
                instructionBox.textContent = "Vilket tal behöver fyllas ut med nollor för att få rätt decimaler? Skriv det:";
                
                questionText.textContent = `${q.n1Str} ${q.opSymbol} ${q.n2Str} = ?`;
                inputField.placeholder = "Svar...";
            } else {
                stepBadge.textContent = "Steg 2: Räkna ut";
                stepBadge.className = "bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-semibold";
                
                if (q.isHard) {
                    instructionBox.textContent = "Det här är lite klurigt! Använd papper och penna för uppställning om du vill.";
                } else {
                    instructionBox.textContent = "Kör huvudräkning och skriv svaret!";
                }

                let html1 = buildDimmedHTML(q.balanced1);
                let html2 = buildDimmedHTML(q.balanced2);

                questionText.innerHTML = `${html1} ${q.opSymbol} ${html2} = ?`;
                inputField.placeholder = "Slutsvar...";
            }
        }

        function submitAnswer(event) {
            event.preventDefault();
            const userVal = inputField.value.trim().replace('.', ',');
            if (userVal === '') return;

            const q = questions[currentIndex];

            if (currentSubStep === 1) {
                if (userVal === q.targetBalancedVal) {
                    score++;
                    currentSubStep = 2;
                    showQuestion();
                } else {
                    triggerErrorEffect();
                }
            } else {
                if (q.acceptFinal.includes(userVal)) {
                    score++;
                    currentIndex++;
                    currentSubStep = 1;
                    showQuestion();
                } else {
                    triggerErrorEffect();
                }
            }
        }

        showQuestion();
    </script>
</body>
</html>
