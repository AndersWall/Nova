<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplikationsutmaningen</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h1 {
            color: #2c3e50;
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }
        .progress {
            color: #7f8c8d;
            font-size: 0.9rem;
            margin-bottom: 1.5rem;
        }
        .question {
            font-size: 2.5rem;
            font-weight: bold;
            color: #34495e;
            margin-bottom: 1.5rem;
        }
        input[type="number"] {
            width: 100%;
            padding: 15px;
            font-size: 1.8rem;
            text-align: center;
            border: 2px solid #bdc3c7;
            border-radius: 10px;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.3s;
        }
        input[type="number"]:focus {
            border-color: #3498db;
        }
        .hidden {
            display: none;
        }
        .results {
            font-size: 1.2rem;
            color: #2c3e50;
            margin-bottom: 1.5rem;
        }
        .btn {
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 1rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="card">
        <div id="quiz-container">
            <h1>Multiplikationsutmaningen</h1>
            <div class="progress" id="progress-text">Fråga 1 av 100</div>
            <div class="question" id="question-text">3 × 4 = ?</div>
            <input type="number" id="answer-input" autocomplete="off" autofocus>
        </div>
        <div id="result-container" class="hidden">
            <h1>Bra jobbat! 🎉</h1>
            <p class="results" id="score-text"></p>
            <button class="btn" onclick="restartQuiz()">Kör igen</button>
        </div>
    </div>

    <script>
        let questions = [];
        let currentIndex = 0;
        let score = 0;

        function generateQuestions() {
            questions = [];
            for (let i = 0; i < 100; i++) {
                const a = Math.floor(Math.random() * 9) + 1;
                const b = Math.floor(Math.random() * 9) + 1;
                questions.push({ a, b, answer: a * b });
            }
        }

        const inputField = document.getElementById('answer-input');
        const questionText = document.getElementById('question-text');
        const progressText = document.getElementById('progress-text');
        const quizContainer = document.getElementById('quiz-container');
        const resultContainer = document.getElementById('result-container');
        const scoreText = document.getElementById('score-text');

        function showQuestion() {
            if (currentIndex < 100) {
                const q = questions[currentIndex];
                questionText.textContent = `${q.a} × ${q.b} = ?`;
                progressText.textContent = `Fråga ${currentIndex + 1} av 100`;
                inputField.value = '';
                inputField.focus();
            } else {
                showResults();
            }
        }

        function showResults() {
            quizContainer.classList.add('hidden');
            resultContainer.classList.remove('hidden');
            scoreText.innerHTML = `Du fick <strong>${score}</strong> av 100 rätt!`;
        }

        function restartQuiz() {
            currentIndex = 0;
            score = 0;
            quizContainer.classList.remove('hidden');
            resultContainer.classList.add('hidden');
            generateQuestions();
            showQuestion();
        }

        inputField.addEventListener('input', function() {
            const rawVal = inputField.value;
            if (rawVal === '') return;

            const userVal = parseInt(rawVal);
            const q = questions[currentIndex];

            // Om svaret är rätt direkt (t.ex. om rätt svar är ensiffrigt och hon skriver det)
            // eller om inmatningen har nått längden på det korrekta svarets antal tecken
            const correctAnswerStr = q.answer.toString();
            
            if (userVal === q.answer) {
                score++;
                currentIndex++;
                showQuestion();
            } else if (rawVal.length >= correctAnswerStr.length) {
                // Om hon skrivit fel antal tecken (t.ex. två siffror på en fråga som bara har en)
                currentIndex++;
                showQuestion();
            }
        });

        // Starta direkt
        generateQuestions();
        showQuestion();
    </script>
</body>
</html>
